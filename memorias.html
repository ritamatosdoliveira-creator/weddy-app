<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Weddy Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF8F5; --card:#FFFDFC; --ink:#302C29; --ink-soft:#8E8780;
  --rust:#B96752; --rust-dark:#9A4F3D; --sage:#7C8A6E; --sage-dark:#5F7355;
  --line:rgba(48,44,41,0.09); --shadow:0 2px 12px rgba(48,44,41,0.055), 0 1px 2px rgba(48,44,41,0.04);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; min-height:100vh; background:var(--cream); font-family:'Manrope',sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px; }
.card{ width:100%; max-width:420px; background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:36px 26px; text-align:center; position:relative; }
.eyebrow{ font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--rust); margin-bottom:8px; }
h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; color:var(--rust-dark); margin:0 0 6px; }
.sub{ font-size:13px; color:var(--ink-soft); margin-bottom:26px; line-height:1.5; }
.field{ text-align:left; margin-bottom:18px; }
.field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
.field input{ width:100%; border:1.6px solid var(--line); background:#fff; border-radius:12px; padding:11px 12px; font-size:14.5px; color:var(--ink); font-family:inherit; outline:none; }
.state-hidden{ display:none !important; }
.msg{ font-size:13px; margin-top:12px; min-height:18px; }
.msg.error{ color:var(--rust-dark); }
.msg.success{ color:var(--sage-dark); }
.memories-upload-btn{ display:inline-flex; align-items:center; gap:7px; padding:12px 18px; border-radius:12px; border:1.6px dashed var(--rust); color:var(--rust); font-size:13.5px; font-weight:600; cursor:pointer; }
.memories-upload-btn svg{ width:16px; height:16px; }
.memories-upload-btn.is-disabled{ opacity:.4; pointer-events:none; }
.memories-preview-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; justify-content:center; }
.memories-thumb-wrap{ position:relative; flex:0 0 auto; width:72px; height:72px; }
.memories-thumb{ width:72px; height:72px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; }
.memories-thumb-wrap.is-uploading .memories-thumb{ opacity:.4; }
.memories-thumb-spin{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.memories-thumb-spin svg{ width:22px; height:22px; animation:weddy-memspin .8s linear infinite; color:#fff; }
.memories-thumb-err{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(179,65,58,.6); border-radius:10px; color:#fff; font-size:18px; font-weight:700; }
@keyframes weddy-memspin{ to{ transform:rotate(360deg); } }
.footer-logo{ margin-top:28px; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:15px; color:var(--rust); opacity:.75; }
.loading{ padding:60px 0; color:var(--ink-soft); font-size:13.5px; }
.lang-switch{ position:absolute; top:14px; right:14px; display:flex; gap:2px; background:var(--cream); border-radius:10px; padding:3px; }
.lang-switch button{ all:unset; box-sizing:border-box; padding:5px 9px; border-radius:8px; font-size:11px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
.lang-switch button.active{ background:var(--rust); color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="lang-switch" id="lang-switch">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
    </div>

    <div id="loading-state" class="loading" data-t="loadingText">A carregar…</div>

    <div id="error-state" class="state-hidden">
      <div class="eyebrow" data-t="errorEyebrow">Ups</div>
      <h1 data-t="errorTitle">Link inválido</h1>
      <div class="sub" data-t="errorSub">Este link de Weddy Memories não é válido. Confirma com os noivos se copiaste o link certo.</div>
    </div>

    <div id="form-state" class="state-hidden">
      <div class="eyebrow" data-t="eyebrow">Weddy Memories</div>
      <h1 data-t="title">Partilha as tuas fotos!</h1>
      <div class="sub" data-t="sub">Tens fotos deste casamento? Os noivos adoravam vê-las — ficam só visíveis para eles.</div>

      <div class="field">
        <label data-t="nameLabel">O teu nome</label>
        <input type="text" id="guest-name-input" data-t-placeholder="namePlaceholder" placeholder="Como te chamas?" autocomplete="name">
      </div>

      <label class="memories-upload-btn" for="memory-file-input" id="memory-upload-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 16l-5.3-5.3a2 2 0 0 0-2.8 0L5 19"/></svg>
        <span data-t="uploadBtn">Adicionar fotografia</span>
      </label>
      <input type="file" id="memory-file-input" accept="image/*" multiple style="display:none;">

      <div class="msg" id="form-msg"></div>
      <div class="memories-preview-grid" id="memories-preview"></div>
    </div>

    <div class="footer-logo">weddy</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyAhqSS-NWuJ5_8Vg64XBb2iR5MIdEcNgGk",
    authDomain: "weddy-app-bd12f.firebaseapp.com",
    projectId: "weddy-app-bd12f",
    storageBucket: "weddy-app-bd12f.firebasestorage.app",
    messagingSenderId: "696758255059",
    appId: "1:696758255059:web:44cbc2e9847d2ab58f8326"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  const TRANSLATIONS = {
    pt: {
      loadingText:'A carregar…',
      errorEyebrow:'Ups',
      errorTitle:'Link inválido',
      errorSub:'Este link de Weddy Memories não é válido. Confirma com os noivos se copiaste o link certo.',
      eyebrow:'Weddy Memories',
      title:'Partilha as tuas fotos!',
      sub:'Tens fotos deste casamento? Os noivos adoravam vê-las — ficam só visíveis para eles.',
      nameLabel:'O teu nome',
      namePlaceholder:'Como te chamas?',
      uploadBtn:'Adicionar fotografia',
      nameRequired:'Escreve o teu nome antes de enviares uma foto.',
      notImage:(n)=>`"${n}" não é uma imagem.`,
      tooLarge:(n)=>`"${n}" é maior que 8MB.`,
      uploading:(n)=> n>1 ? `A carregar ${n} fotos… não feches esta página.` : 'A carregar a foto… não feches esta página.',
      thanks:'Obrigado por partilhar! 💛',
      uploadError:'Não foi possível enviar esta foto. Verifica a internet e tenta novamente.'
    },
    en: {
      loadingText:'Loading…',
      errorEyebrow:'Oops',
      errorTitle:'Invalid link',
      errorSub:'This Weddy Memories link isn\'t valid. Check with the couple that you copied the right link.',
      eyebrow:'Weddy Memories',
      title:'Share your photos!',
      sub:'Got photos from this wedding? The couple would love to see them — only they can view this gallery.',
      nameLabel:'Your name',
      namePlaceholder:'What\'s your name?',
      uploadBtn:'Add photo',
      nameRequired:'Enter your name before uploading a photo.',
      notImage:(n)=>`"${n}" is not an image.`,
      tooLarge:(n)=>`"${n}" is larger than 8MB.`,
      uploading:(n)=> n>1 ? `Uploading ${n} photos… don't close this page.` : 'Uploading photo… don\'t close this page.',
      thanks:'Thanks for sharing! 💛',
      uploadError:'Could not upload this photo. Check your connection and try again.'
    }
  };
  let currentLang = 'pt';
  try{
    const saved = localStorage.getItem('weddy_rsvp_lang');
    if(saved && TRANSLATIONS[saved]) currentLang = saved;
  }catch(e){}
  function t(key){
    const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.pt;
    return dict[key] !== undefined ? dict[key] : (TRANSLATIONS.pt[key] || '');
  }
  function applyTranslations(){
    document.documentElement.lang = currentLang==='en' ? 'en' : 'pt-PT';
    document.querySelectorAll('[data-t]').forEach(el=>{
      const val = t(el.dataset.t);
      if(typeof val === 'string') el.textContent = val;
    });
    document.querySelectorAll('[data-t-placeholder]').forEach(el=>{
      const val = t(el.dataset.tPlaceholder);
      if(typeof val === 'string') el.placeholder = val;
    });
    document.querySelectorAll('#lang-switch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang===currentLang);
    });
  }
  document.querySelectorAll('#lang-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentLang = btn.dataset.lang;
      try{ localStorage.setItem('weddy_rsvp_lang', currentLang); }catch(e){}
      applyTranslations();
    });
  });
  applyTranslations();

  function show(id){
    ['loading-state','error-state','form-state'].forEach(s=>{
      document.getElementById(s).classList.toggle('state-hidden', s!==id);
    });
  }

  // Link público (sem token de convidado): basta o weddingId, na forma
  // memorias.html?w=<weddingId>. Os noivos obtêm este link/QR em
  // Definições → Weddy Memories → "Link para o dia do casamento". Usa
  // exatamente o mesmo mecanismo do upload por convite individual
  // (rsvp.html) — Storage em memories/{weddingId}/{pasta}/{ficheiro} e um
  // registo em "memories" no Firestore — só que com uma pasta fixa
  // ("publico") em vez do token de um convidado específico, já que aqui
  // não há nenhum convidado identificado à partida. A segurança é a mesma
  // de sempre: quem envia nunca consegue ler nada de volta (Storage Rules),
  // só os noivos autenticados veem a galeria.
  const params = new URLSearchParams(location.search);
  const weddingId = params.get('w');
  if(!weddingId){
    show('error-state');
  } else {
    show('form-state');
  }

  let activeUploads = 0;
  // Nunca deixar um envio preso em "a carregar" para sempre — a margem
  // cresce com o tamanho do ficheiro (vídeos demoram muito mais que
  // fotos), em vez de um valor fixo demasiado curto para um vídeo.
  function withUploadTimeout(promise, fileSizeBytes){
    const ms = Math.min(180000, Math.max(25000, 20000 + (fileSizeBytes||0)/1024/1024*1500));
    return Promise.race([
      promise,
      new Promise((_, reject)=> setTimeout(()=> reject(new Error('weddy-upload-timeout')), ms))
    ]);
  }
  function updateLoadingState(){
    const statusEl = document.getElementById('form-msg');
    if(activeUploads > 0){
      statusEl.textContent = t('uploading')(activeUploads);
      statusEl.className = 'msg';
    }
  }
  window.addEventListener('beforeunload', e=>{
    if(activeUploads > 0){ e.preventDefault(); e.returnValue = ''; }
  });

  document.getElementById('memory-file-input').addEventListener('change', e=>{
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    const statusEl = document.getElementById('form-msg');
    const previewEl = document.getElementById('memories-preview');
    const nameInput = document.getElementById('guest-name-input');
    const guestName = nameInput.value.trim();
    if(!guestName){
      statusEl.textContent = t('nameRequired');
      statusEl.className = 'msg error';
      nameInput.focus();
      e.target.value = '';
      return;
    }
    let anySuccess = false;
    files.forEach(file=>{
      if(!file.type.startsWith('image/')){
        statusEl.textContent = t('notImage')(file.name);
        statusEl.className = 'msg error';
        return;
      }
      if(file.size > 8*1024*1024){
        statusEl.textContent = t('tooLarge')(file.name);
        statusEl.className = 'msg error';
        return;
      }
      const wrap = document.createElement('div');
      wrap.className = 'memories-thumb-wrap is-uploading';
      const objectUrl = URL.createObjectURL(file);
      const img = document.createElement('img');
      img.src = objectUrl;
      img.className = 'memories-thumb';
      wrap.appendChild(img);
      const spin = document.createElement('div');
      spin.className = 'memories-thumb-spin';
      spin.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';
      wrap.appendChild(spin);
      previewEl.appendChild(wrap);

      activeUploads++;
      updateLoadingState();
      const path = `memories/${weddingId}/publico/${Date.now()}_${file.name}`;
      const ref = storage.ref(path);
      withUploadTimeout(ref.put(file).then(()=>{
        return db.collection('memories').add({
          weddingId: weddingId,
          token: 'publico',
          guestName: guestName,
          storagePath: path,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }), file.size).then(()=>{
        wrap.classList.remove('is-uploading');
        anySuccess = true;
        activeUploads--;
        if(activeUploads > 0){ updateLoadingState(); }
        else { statusEl.textContent = t('thanks'); statusEl.className = 'msg success'; }
      }).catch(err=>{
        console.error('Weddy memories (public) upload error:', err && err.code, err && err.message);
        wrap.classList.remove('is-uploading');
        wrap.classList.add('is-error');
        const errIcon = document.createElement('div');
        errIcon.className = 'memories-thumb-err';
        errIcon.textContent = '!';
        wrap.appendChild(errIcon);
        activeUploads--;
        if(activeUploads > 0){ updateLoadingState(); }
        else if(!anySuccess){
          // O código do erro (ex: "storage/unauthorized", "permission-denied")
          // aparece junto da mensagem para dar para diagnosticar à distância.
          const code = err && (err.code || err.message);
          statusEl.textContent = t('uploadError') + (code ? ` (${code})` : '');
          statusEl.className = 'msg error';
        }
      });
    });
    e.target.value = '';
  });
})();
</script>
</body>
</html>
