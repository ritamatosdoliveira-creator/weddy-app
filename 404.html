<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada · Weddy</title>
<script>
// GitHub Pages serve este ficheiro para qualquer caminho inexistente.
// /c/<slug> → site.html?s=<slug> (mantém ?g=token se existir).
(function(){
  var m = location.pathname.match(/^\/c\/([a-z0-9-]{3,40})\/?$/i);
  if(m){
    var q = new URLSearchParams(location.search); q.set('s', m[1].toLowerCase());
    location.replace('/site.html?' + q.toString());
  }
})();
</script>

html,body{margin:0;background:#FAF8F5;font-family:system-ui,sans-serif;color:#302C29}

</style>
