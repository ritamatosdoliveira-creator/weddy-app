# PROPOSTA (não ativa até a origem do GitHub Pages ser mudada para "GitHub Actions" nas definições do repositório — passo da proprietária).
# Publica APENAS o artefacto construído pela allowlist (scripts/build-public.js); nunca a raiz do repositório.
name: Publicar site (allowlist)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir artefacto público (allowlist)
        run: node scripts/build-public.js _site
      - name: Verificar que nenhum ficheiro privado entrou no artefacto
        run: node tests/k4/public-artifact.test.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
